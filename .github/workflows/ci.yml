name: CI

on:
  push:
    branches:
      - master
      - release-*
  pull_request:
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true

defaults:
  run:
    shell: pwsh

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
          - os: ubuntu-latest
            name: Linux

    steps:
      - name: Check for secrets
        env:
          SECRETS_AVAILABLE: ${{ secrets.SECRETS_AVAILABLE }}
        run: |
          exit $(If ($env:SECRETS_AVAILABLE -eq 'true') { 0 } Else { 1 })

      - parallel:
          - name: Checkout
            uses: actions/checkout@v7.0.1
            with:
              fetch-depth: 0
          - name: Azure login
            uses: azure/login@v3.1.0
            with:
              creds: ${{ secrets.AZURE_ACI_CREDENTIALS }}
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6.1.0
        with:
          global-json-file: global.json

      - name: Build
        id: build
        run: dotnet build src --configuration Release
        background: true

      - name: Setup WSL
        uses: Particular/setup-wsl-action@v1.3.0
        timeout-minutes: 5
        with:
          memory: 6GB

      - parallel:
          - name: Setup Azure Service Bus Emulator
            uses: Particular/setup-azureservicebus-action@v3.0.0
            with:
              connection-string-name: AzureServiceBus_Emulator_ConnectionString
              azure-credentials: ${{ secrets.AZURE_ACI_CREDENTIALS }}
              use-emulator: true
              tag: ASBTransport
          - name: Setup Azure Service Bus
            uses: Particular/setup-azureservicebus-action@v3.0.0
            with:
              connection-string-name: AzureServiceBus_ConnectionString
              azure-credentials: ${{ secrets.AZURE_ACI_CREDENTIALS }}
              tag: ASBTransport

      - name: Wait for build
        wait: build

      - name: Upload packages
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: NuGet packages
          path: nugets/
          retention-days: 7

      - name: Run tests
        uses: Particular/run-tests-action@v1.9.0
        with:
          max-parallel: 6
